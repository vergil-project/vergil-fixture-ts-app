name: Ops

on:
  schedule:
    - cron: '34 1 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  github-config:
    uses: vergil-project/vergil-actions/.github/workflows/ops-github-config.yml@v2.1
    permissions:
      contents: read
      issues: write
    secrets: inherit

  # The daily agent audit (epic vergil-project/.github#1384). It runs after the
  # config job, but a failing config job does not skip it. It has no reporting
  # job: its findings are its exit status and run log, which hoshin reads.
  agent-audit:
    needs: github-config
    if: ${{ !cancelled() }}
    uses: vergil-project/vergil-actions/.github/workflows/ops-agent-audit.yml@v2.1
    permissions:
      contents: read
    secrets: inherit
